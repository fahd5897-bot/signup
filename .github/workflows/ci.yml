name: CI

# The Definition of Done for this project is "it works and it is tested
# locally". This workflow is what stops that from depending on someone
# remembering: lint, the tenant-isolation guard, and the full suite — including
# the Row-Level Security tests, which need a real PostgreSQL because a policy
# asserted only in Python is a comment, not a security control.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rfp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        # The rate limiter stores its counters here. It falls back to memory
        # when Redis is unreachable, so without this service the throttling
        # tests would pass against a per-process counter — the exact
        # configuration the limit is meant not to have.
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Test-only values. Real secrets never appear in the repository; the
      # deployed environments read them from their own secret store.
      ANTHROPIC_API_KEY: sk-test
      VOYAGE_API_KEY: pa-test
      JWT_SECRET: ci-secret-not-for-production-0123456789abcdef
      REDIS_URL: redis://localhost:6379/0
      # The rate-limiting tests switch it back on for themselves; leaving
      # it on globally would throttle the suite's own registration volume.
      RATE_LIMIT_ENABLED: "false"
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/rfp
      TEST_POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/rfp
      # The suite derives the unprivileged role's DSN from the one above;
      # the service container requires a password, so it needs this one.
      TEST_APP_ROLE_PASSWORD: postgres

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the runtime image (backend/docker/Dockerfile) and the
          # target-version ruff and mypy are configured for. A CI
          # interpreter older than the deployed one passes syntax the
          # image would accept and rejects syntax it would run.
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tenant isolation guard
        # Every Qdrant filter must come from the one module that scopes it. A
        # hand-rolled filter with a missing tenant condition does not raise —
        # it silently matches the wrong rows.
        run: python scripts/check_filter_usage.py

      - name: Create the unprivileged application role
        # The RLS tests are meaningless as a superuser: the owner is exempt
        # from nothing only because the tables are FORCE ROW LEVEL SECURITY,
        # and a suite that connects as postgres would pass while proving the
        # policies are never evaluated.
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d rfp -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE rfp_app LOGIN PASSWORD 'postgres';
          GRANT USAGE ON SCHEMA public TO rfp_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rfp_app;
          SQL

      - name: Migrate
        run: alembic upgrade head

      - name: Grant table access to the application role
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d rfp -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO rfp_app;
          GRANT EXECUTE ON FUNCTION auth_lookup_user(text) TO rfp_app;
          SQL

      - name: Test
        run: pytest -q

      - name: Migrations are reversible
        # A migration that cannot be rolled back is a one-way door discovered
        # during an incident. Cheaper to find here.
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
