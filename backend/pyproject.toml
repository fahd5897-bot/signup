[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "T20"]
ignore = [
    "S101",  # assert is the point of a test file
    # PEP 695 type parameters are a style preference, not a correctness
    # rule, and TypeVar keeps helper modules importable under the 3.11
    # interpreters people still have lying around locally.
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# Build-time guards are command-line tools; stdout is their entire interface,
# and routing it through the application logger would hide it from CI output.
"scripts/*" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags function calls in argument defaults. FastAPI's entire dependency
# system is built on exactly that, so these are declared immutable rather than
# suppressed with per-line noqa across every route signature.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a live PostgreSQL; skipped when none is reachable",
]
